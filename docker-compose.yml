services:
  app:
    build: .
    image: find:latest
    environment:
      SEARCH_DB: '/opt/find/search.db'
      TZ: 'Europe/Rome'
      FLASK_DEBUG: false
      # 169= one week
      REINDEX_INTERVAL_HOURS: 168
      FIND_WEB_WORKERS: 2
      FIND_SHOW_CACHED_PAGE: disabled
    ports:
      - "49152:7001"
    # Ensure around 2 cpu minus 10% 
    cpus: 1.90
    volumes:
      - $FIND_HOME:/opt/find
    
